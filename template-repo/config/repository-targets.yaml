# Replace this scaffold with the real private repository metadata before the
# instance can publish draft PRs. You can also generate a first draft from the
# upstream helpers before copying the template into a private repository.
targets:
  - target_id: primary-app
    host: github
    owner: your-org
    name: your-private-repo
    default_branch: main
    enabled: true
    branch_prefix: continuum/
    allowed_remote_urls:
      - git@github.com:your-org/your-private-repo.git
      - https://github.com/your-org/your-private-repo.git
