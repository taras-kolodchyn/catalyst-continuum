model_list:
  - model_name: local-ollama-coder
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: os.environ/LITELLM_OLLAMA_API_BASE
  - model_name: local-openai-coder
    litellm_params:
      model: openai/local-coder
      api_base: os.environ/LITELLM_OPENAI_COMPAT_API_BASE
      api_key: os.environ/LITELLM_OPENAI_COMPAT_API_KEY

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  set_verbose: false
