model_list:
  - model_name: local-macos-native
    litellm_params:
      model: os.environ/LITELLM_MACOS_NATIVE_MODEL
      api_base: os.environ/LITELLM_MACOS_NATIVE_API_BASE
      api_key: os.environ/LITELLM_MACOS_NATIVE_API_KEY
  - model_name: local-ollama-coder
    litellm_params:
      model: os.environ/LITELLM_OLLAMA_MODEL
      api_base: os.environ/LITELLM_OLLAMA_API_BASE

general_settings:
  database_url: os.environ/DATABASE_URL

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  set_verbose: false
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    namespace: os.environ/LITELLM_CACHE_NAMESPACE
    ttl: 3600
    supported_call_types:
      - completion
      - acompletion
      - responses
      - aresponses
