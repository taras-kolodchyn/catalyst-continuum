name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Check pinned versions
        run: ./scripts/check-versions.sh

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Lint shell scripts
        run: ./scripts/lint-shell.sh

  sbom:
    needs:
      - versions
      - shell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Generate orchestrator SBOM
        run: ./scripts/generate-sbom.sh

      - name: Generate SBOM artifact provenance attestation
        if: ${{ !env.ACT && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: .continuum/sbom/orchestrator-image.spdx.json

      - name: Upload SBOM artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: orchestrator-sbom
          path: .continuum/sbom/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  rust:
    needs:
      - versions
      - shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Run Rust CI checks
        run: ./scripts/ci-rust.sh

  compose:
    needs:
      - versions
      - shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Validate Docker Compose configuration
        run: ./scripts/ci-compose.sh

  smoke:
    name: smoke (${{ matrix.scenario }})
    needs:
      - versions
      - shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - mvp-container-service
          - mvp-cli-tool
          - mvp-worker-service
          - mcp-stateful-cli-tool
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: 1.94.1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run MVP smoke tests
        env:
          CATALYST_SKIP_WORKSPACE_BUILD: "1"
          CI_SMOKE_SCENARIO: ${{ matrix.scenario }}
        run: ./scripts/ci-smoke.sh
