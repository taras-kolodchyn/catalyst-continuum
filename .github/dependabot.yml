version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    commit-message:
      prefix: cargo

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /orchestrator
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 3
    commit-message:
      prefix: docker

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 3
    commit-message:
      prefix: infra
