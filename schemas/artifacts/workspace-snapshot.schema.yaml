$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:catalyst-continuum:schemas:artifacts:workspace-snapshot:v0.1"
title: "Catalyst Continuum Workspace Snapshot Artifact"
description: "Persisted workspace snapshot manifest composed from scaffold and code bundle artifacts."
type: object
additionalProperties: false
required:
  - schema_version
  - artifact_type
  - run_id
  - current_path
  - source_count
  - file_count
  - sources
  - files
properties:
  schema_version:
    type: string
    const: "v0.1"
  artifact_type:
    type: string
    const: "workspace_snapshot"
  run_id:
    $ref: "#/$defs/uuid_string"
  pack_id:
    anyOf:
      - type: string
        minLength: 1
      - type: "null"
  repository_name:
    anyOf:
      - type: string
        minLength: 1
      - type: "null"
  current_path:
    type: string
    minLength: 1
  source_count:
    type: integer
    minimum: 1
  file_count:
    type: integer
    minimum: 1
  sources:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/workspace_snapshot_source"
  files:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/workspace_snapshot_file"
$defs:
  uuid_string:
    type: string
    format: uuid
  workspace_snapshot_source:
    type: object
    additionalProperties: false
    required:
      - artifact_id
      - artifact_type
      - location_value
    properties:
      artifact_id:
        $ref: "#/$defs/uuid_string"
      artifact_type:
        type: string
        enum:
          - scaffold_bundle
          - code_bundle
      location_value:
        type: string
        minLength: 1
      created_at:
        anyOf:
          - type: string
            minLength: 1
          - type: "null"
      task_id:
        anyOf:
          - $ref: "#/$defs/uuid_string"
          - type: "null"
      template_id:
        anyOf:
          - type: string
            minLength: 1
          - type: "null"
  workspace_snapshot_file:
    type: object
    additionalProperties: false
    required:
      - path
      - source_artifact_id
      - content_digest
      - byte_count
    properties:
      path:
        type: string
        minLength: 1
      source_artifact_id:
        $ref: "#/$defs/uuid_string"
      content_digest:
        type: string
        pattern: "^sha256:[0-9a-f]{64}$"
      byte_count:
        type: integer
        minimum: 0
