$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:catalyst-continuum:schemas:artifact:v0.1"
title: "Catalyst Continuum Artifact"
description: "Metadata record describing an immutable output generated by a run or task."
type: object
additionalProperties: false
required:
  - schema_version
  - artifact_id
  - run_id
  - type
  - format
  - location
  - created_at
properties:
  schema_version:
    type: string
    const: "v0.1"
  artifact_id:
    type: string
    format: uuid
  run_id:
    type: string
    format: uuid
  task_id:
    type: string
    format: uuid
  type:
    type: string
    enum:
      - brief_snapshot
      - backlog
      - architecture
      - scaffold_plan
      - source_bundle
      - patch
      - test_report
      - evaluation_report
      - sbom
      - attestation
      - pull_request
      - log
  format:
    type: string
    enum:
      - json
      - yaml
      - md
      - txt
      - patch
      - tar_gz
      - uri
  location:
    $ref: "#/$defs/location"
  content_digest:
    type: string
    description: "Digest of the artifact content, typically sha256."
  labels:
    type: array
    items:
      type: string
    uniqueItems: true
  source_artifact_ids:
    type: array
    items:
      type: string
      format: uuid
    uniqueItems: true
  created_at:
    type: string
    format: date-time
  metadata:
    type: object
    additionalProperties:
      oneOf:
        - type: string
        - type: number
        - type: integer
        - type: boolean
$defs:
  location:
    type: object
    additionalProperties: false
    required:
      - kind
      - value
    properties:
      kind:
        type: string
        enum:
          - path
          - url
          - object_store
          - git_ref
      value:
        type: string
